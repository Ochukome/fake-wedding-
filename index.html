<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Traditional Union</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col justify-between antialiased overflow-x-hidden relative">

    <div class="background-overlay"></div>

    <header class="w-full max-w-5xl mx-auto px-8 pt-6 flex justify-between items-center z-10">
        <div class="school-logo-frame">
            <img src="school logo.jpg" alt="School Logo" class="w-full h-full object-contain rounded-[0.9rem]">
        </div>
        <div>
            <span class="gala-badge">
                Cultural Gala 2026
            </span>
        </div>
    </header>

    <main class="w-full max-w-lg mx-auto px-6 py-6 flex-grow flex items-center justify-center z-10">
        
        <!-- Welcome Screen -->
        <div id="welcome-screen" class="content-card text-center w-full">
            <div class="flourish-divider-top mx-auto"></div>
            
            <div class="mt-4">
                <h1 class="text-4xl font-serif font-bold tracking-widest text-[#F5F5F0] sm:text-5xl uppercase">
                    THE WEDDING PARTY
                </h1>
                
                <div class="flourish-heart-divider mx-auto my-4"></div>
                
                <p class="text-base text-stone-200 font-normal leading-relaxed max-w-sm mx-auto mt-2">
                    Before the party begins, let's settle one important question... <br>
                    <span class="text-[#E2C385] font-semibold italic block mt-1 text-lg">(whose side are you on?)</span>
                </p>
            </div>
            
            <div class="pt-6">
                <button onclick="navigateToForm()" class="btn-luxury-gold">
                    FIND YOUR SIDE
                </button>
            </div>
        </div>

        <!-- Form Screen -->
        <div id="form-screen" class="content-card w-full space-y-6 hidden">
            <div class="text-center space-y-1">
                <h2 class="text-3xl font-serif font-bold text-[#F5F5F0] tracking-wide capitalize">Guest Accreditation</h2>
                <p class="text-xs text-stone-400">Input your credentials so the ancestors can sort you properly.</p>
            </div>
            <form id="accreditation-form" onsubmit="handleFormSubmit(event)" class="space-y-5">
                <div class="space-y-1.5">
                    <label class="text-[11px] font-semibold uppercase tracking-widest text-[#E2C385]">Full Name</label>
                    <input type="text" id="guest-name" required placeholder="e.g., Sagoechukwu Tinubu" class="input-field">
                </div>
                <div class="space-y-1.5">
                    <label class="text-[11px] font-semibold uppercase tracking-widest text-[#E2C385]">Email Address</label>
                    <input type="email" id="guest-email" required placeholder="your.name@example.com" class="input-field">
                </div>
                <button type="submit" class="btn-luxury-gold">
                    Let the Ancestors Decide
                </button>
            </form>
        </div>

        <!-- Shuffling Loading Screen -->
        <div id="shuffling-screen" class="text-center space-y-6 w-full px-4 hidden">
            <div class="drum-container">
                <div class="spinner-outer"></div>
                <div class="spinner-inner"></div>
                <span class="drum-emoji">🪘</span>
            </div>
            <p id="shuffling-text" class="text-lg font-serif font-medium text-[#E2C385] italic tracking-wider min-h-[56px]"></p>
        </div>

        <!-- Reveal Screen -->
        <div id="reveal-screen" class="reveal-card text-center space-y-6 hidden">
            <div class="flex justify-center items-center gap-2 pt-2">
                <span class="premium-sparkle">✦</span>
                <span class="premium-sparkle" style="animation-delay: 0.3s;">✨</span>
                <span class="premium-sparkle" style="animation-delay: 0.15s;">✦</span>
            </div>
            
            <div class="space-y-2">
                <h2 id="team-title" class="text-3xl font-serif font-bold tracking-wide capitalize sm:text-4xl leading-tight text-[#F5F5F0]"></h2>
                <p id="team-tribe" class="text-[10px] font-semibold tracking-widest text-[#E2C385] uppercase bg-black/40 px-5 py-1.5 rounded-full w-max mx-auto border border-white/5"></p>
            </div>
            
            <div class="vibe-box">
                <p class="text-sm sm:text-base font-normal italic leading-relaxed text-stone-200">
                    "Welcome, <span id="display-name" class="text-[#E2C385] font-semibold"></span>! <span id="team-vibe"></span>"
                </p>
            </div>
            
            <div class="pt-2">
                <a id="whatsapp-link" href="#" target="_blank" rel="noopener noreferrer" class="btn-whatsapp">
                    Join Family WhatsApp Group
                </a>
            </div>
        </div>

    </main>

    <footer class="w-full text-center py-4 border-t border-white/5 bg-black/60 backdrop-blur-md z-10">
        <p class="text-[9px] font-semibold tracking-widest text-stone-500 uppercase">
            Powered by Ochukome
        </p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
